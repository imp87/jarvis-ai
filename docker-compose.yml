services:
  postgres:
    # pgvector ships inside the Postgres image — no separate vector database.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: jarvis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to loopback: the database is never reachable from the network,
      # only from other containers and from this host.
      #
      # Published on a non-default port so the stack does not fight a Postgres
      # already installed on the host, and so a scan for 5432 finds nothing.
      # Containers still talk to each other on 5432 over the compose network;
      # only this host-side mapping moves.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 20

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    # Tagged explicitly so the migrate service below can reuse this exact image
    # instead of building its own from the same Dockerfile.
    image: jarvis-orchestrator:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://jarvis:${POSTGRES_PASSWORD:-jarvis}@postgres:5432/jarvis
      ORCHESTRATOR_PORT: 8080
      # Everything below comes from the repo-root .env — never hardcode secrets here.
      MASTER_KEY: ${MASTER_KEY:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      QUIET_HOURS_START: ${QUIET_HOURS_START:-22:00}
      QUIET_HOURS_END: ${QUIET_HOURS_END:-07:00}
      QUIET_HOURS_TIMEZONE: ${QUIET_HOURS_TIMEZONE:-Europe/Berlin}
      MAX_CALLS_PER_HOUR: ${MAX_CALLS_PER_HOUR:-2}
      MAX_CALLS_PER_DAY: ${MAX_CALLS_PER_DAY:-8}
      # Separate allowance for the orchestrator's own alarms, so a day of
      # reminders cannot exhaust the channel that reports a failure. These pass
      # quiet hours, which is why the ceiling is deliberately low.
      SYSTEM_ALERT_CALLS_PER_HOUR: ${SYSTEM_ALERT_CALLS_PER_HOUR:-1}
      SYSTEM_ALERT_CALLS_PER_DAY: ${SYSTEM_ALERT_CALLS_PER_DAY:-3}
      OWNER_PHONE_NUMBER: ${OWNER_PHONE_NUMBER:-}
      VOICE_PIPELINE_URL: ${VOICE_PIPELINE_URL:-}
      # Lets the orchestrator speak first — scheduled tasks and anything it
      # notices while nobody is watching. Without it that tool is withheld
      # rather than offered and silently failing.
      TELEGRAM_ADAPTER_URL: ${TELEGRAM_ADAPTER_URL:-http://telegram-adapter:8081}
      TASK_POLL_INTERVAL_MS: ${TASK_POLL_INTERVAL_MS:-20000}
      # stdio MCP servers run inside this container, so their paths are container
      # paths. Registry rows store ${MCP_WORKSPACE_DIR} rather than a literal
      # path, which is what lets one row work on a dev host and here.
      MCP_WORKSPACE_DIR: /workspace
      # Embedded "web" MCP server. The default provider needs no key but is a
      # scrape: a hosted server generally gets a bot check rather than results,
      # so set WEB_SEARCH_PROVIDER to an API provider here.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-duckduckgo}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      WEB_REQUEST_TIMEOUT_MS: ${WEB_REQUEST_TIMEOUT_MS:-15000}
      WEB_FETCH_MAX_BYTES: ${WEB_FETCH_MAX_BYTES:-2000000}
    volumes:
      - ${MCP_WORKSPACE_HOST_DIR:-./.local/workspace}:/workspace
    ports:
      # Also loopback-only: Nginx Proxy Manager terminates TLS and forwards here.
      # Nothing in this stack should be directly internet-facing.
      - "127.0.0.1:${ORCHESTRATOR_HOST_PORT:-18780}:8080"

  # One-off migration runner:  docker compose run --rm migrate
  #
  # The orchestrator image already carries the compiled migrator and the SQL
  # files, so a server needs no Node, pnpm or checkout-level install just to
  # bring the schema up to date — which is otherwise a surprising amount of
  # toolchain to require on a machine that only runs containers.
  #
  # Behind a profile so it never starts as part of `docker compose up`.
  migrate:
    # Deliberately no `build:` — it reuses the orchestrator image. Declaring the
    # same Dockerfile here built a *second* image, and `docker compose build
    # orchestrator` then left it behind: a new migration was in one image and not
    # the other, so `migrate` reported "already up to date" while the schema was
    # a version behind. Run `docker compose build orchestrator` first.
    image: jarvis-orchestrator:local
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jarvis:${POSTGRES_PASSWORD:-jarvis}@postgres:5432/jarvis
      # Must match the orchestrator: it is substituted into the vector column
      # definitions, so a mismatch corrupts embeddings rather than erroring.
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
    command: ["node", "/app/node_modules/@jarvis/db/dist/cli/migrate.js"]
    healthcheck:
      disable: true

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      - orchestrator
    environment:
      NODE_ENV: production
      PORT: 3000
      ORCHESTRATOR_URL: http://orchestrator:8080
      # Held server-side only: the browser never sees it, so a session on this
      # UI cannot be turned into direct access to the orchestrator.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
    ports:
      # Loopback only, like everything else — Nginx Proxy Manager terminates TLS.
      - "127.0.0.1:${ADMIN_HOST_PORT:-18783}:3000"

  telegram-adapter:
    build:
      context: .
      dockerfile: services/telegram-adapter/Dockerfile
    restart: unless-stopped
    depends_on:
      - orchestrator
    environment:
      NODE_ENV: production
      TELEGRAM_ADAPTER_PORT: 8081
      ORCHESTRATOR_URL: http://orchestrator:8080
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # polling needs no inbound reachability — see docs/telegram-setup.md §3.
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-/telegram/webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_IP_ALLOWLIST: ${TELEGRAM_IP_ALLOWLIST:-true}
      STT_ENGINE: ${STT_ENGINE:-local}
      TTS_ENGINE: ${TTS_ENGINE:-local}
      WHISPER_MODEL: ${WHISPER_MODEL:-Xenova/whisper-base}
      # Keep the model cache on a volume; otherwise every container rebuild
      # re-downloads several hundred megabytes of weights.
      WHISPER_CACHE_DIR: /models/whisper
      # PIPER_BINARY / PIPER_MODEL are deliberately NOT inherited from .env:
      # those hold host paths for running natively, and a host path inside a
      # container is how this broke before. The image ships Piper with matching
      # defaults, so there is nothing to configure here.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-}
      OPENAI_STT_PROMPT: ${OPENAI_STT_PROMPT:-}
      OPENAI_TTS_SPEED: ${OPENAI_TTS_SPEED:-1.15}
    volumes:
      # Whisper weights (~280 MB) — without this every restart re-downloads them.
      - speech-models:/models
    ports:
      # Loopback only; the local Nginx Proxy Manager terminates TLS in front.
      - "127.0.0.1:${TELEGRAM_HOST_PORT:-18781}:8081"

  voice-pipeline:
    build:
      context: .
      dockerfile: services/voice-pipeline/Dockerfile
    restart: unless-stopped
    depends_on:
      - orchestrator
    environment:
      NODE_ENV: production
      VOICE_PIPELINE_PORT: 8082
      ORCHESTRATOR_URL: http://orchestrator:8080
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      SIP_CALLER_ID: ${SIP_CALLER_ID:-}
      OWNER_PHONE_NUMBER: ${OWNER_PHONE_NUMBER:-}
      VOICE_GREETING: ${VOICE_GREETING:-Master, Jarvis hier. Womit kann ich dienen?}
      VOICE_IDLE_HANGUP_MS: ${VOICE_IDLE_HANGUP_MS:-30000}
      VOICE_MODE: ${VOICE_MODE:-turn}
      STT_ENGINE: ${STT_ENGINE:-local}
      TTS_ENGINE: ${TTS_ENGINE:-local}
      WHISPER_MODEL: ${WHISPER_MODEL:-Xenova/whisper-base}
      WHISPER_CACHE_DIR: /models/whisper
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-}
      OPENAI_STT_PROMPT: ${OPENAI_STT_PROMPT:-}
      OPENAI_TTS_SPEED: ${OPENAI_TTS_SPEED:-1.15}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-cedar}
    volumes:
      - speech-models:/models
      # Shared with Asterisk: the pipeline writes call files, Asterisk dials them.
      - asterisk-spool:/var/spool/asterisk
    ports:
      # Published on loopback so Asterisk can reach them when it runs with host
      # networking (see below). Asterisk's per-call media WebSocket is served
      # on this same HTTP port; nothing else should be able to reach it.
      #
      # The HTTP mapping is the one host-side mapping that is not cosmetic:
      # Asterisk dials back to it for authorisation and the media WebSocket.
      - "127.0.0.1:${VOICE_PIPELINE_HOST_PORT:-18782}:8082"

  asterisk:
    build:
      context: .
      dockerfile: services/voice-pipeline/asterisk/Dockerfile
    restart: unless-stopped
    depends_on:
      - voice-pipeline
    # SIP and RTP do not survive Docker's NAT: the FritzBox is on the LAN, and
    # RTP negotiates ports dynamically. Host networking is the only arrangement
    # that reliably works.
    #
    # This is a Linux-only setup. On Docker Desktop for Windows or macOS the
    # container does not share the host's LAN, so registration to fritz.box will
    # not work there — run this on the Debian server.
    network_mode: host
    environment:
      SIP_ADRESS: ${SIP_ADRESS:-fritz.box}
      SIP_USER: ${SIP_USER:-}
      SIP_PASSWORD: ${SIP_PASSWORD:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      PIPELINE_HTTP: http://127.0.0.1:${VOICE_PIPELINE_HOST_PORT:-18782}
      PIPELINE_MEDIA_HOST: 127.0.0.1:${VOICE_PIPELINE_HOST_PORT:-18782}
    volumes:
      - asterisk-spool:/var/spool/asterisk

volumes:
  postgres-data:
  speech-models:
  asterisk-spool:
