;; A new authenticated WebSocket is opened for every call. It bridges the SIP
;; channel to the Node voice pipeline at 16 kHz without AudioSocket's forced
;; 8-kHz SLINEAR conversion.

[jarvis-media]
type = websocket_client
uri = ws://${PIPELINE_MEDIA_HOST}/v1/media?token=${SERVICE_TOKEN}
protocols = media
connection_type = per_call_config
connection_timeout = 1000
reconnect_interval = 500
reconnect_attempts = 3
tls_enabled = no
