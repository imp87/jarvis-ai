;; Registers Asterisk at the FritzBox as an IP telephone.
;;
;; Create the extension first: FritzBox web UI -> Telefonie -> Telefoniegeräte
;; -> Neues Gerät -> LAN/WLAN-Telefon (IP-Telefon). The username and password it
;; shows go into SIP_USER / SIP_PASSWORD; the internal number it assigns (**621)
;; is what you dial to reach the agent from any phone in the house.
;;
;; Placeholders are substituted at container start from the environment, so no
;; credential is ever written into the image or the repository.

[global]
type = global
user_agent = Jarvis

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0

;; --- Outbound registration to the FritzBox ---------------------------------
[fritzbox]
type = registration
transport = transport-udp
outbound_auth = fritzbox-auth
server_uri = sip:${SIP_ADRESS}
client_uri = sip:${SIP_USER}@${SIP_ADRESS}
retry_interval = 60
;; Keep trying: a FritzBox reboot must not leave the agent silently unreachable.
forbidden_retry_interval = 300
expiration = 300

[fritzbox-auth]
type = auth
auth_type = userpass
username = ${SIP_USER}
password = ${SIP_PASSWORD}

[fritzbox]
type = aor
contact = sip:${SIP_ADRESS}
qualify_frequency = 60

[fritzbox]
type = endpoint
transport = transport-udp
context = jarvis-inbound
;; Prefer G.722 when the FritzBox and handset support HD telephony. The media
;; bridge receives slin16, preserving this extra speech detail for STT. G.711
;; remains the fallback for external callers and non-HD handsets.
disallow = all
allow = g722
allow = alaw
allow = ulaw
outbound_auth = fritzbox-auth
aors = fritzbox
from_user = ${SIP_USER}
;; Trust the caller ID the FritzBox presents; the allowlist is enforced by the
;; pipeline, not here.
trust_id_inbound = yes
direct_media = no

[fritzbox]
type = identify
endpoint = fritzbox
match = ${SIP_ADRESS}
