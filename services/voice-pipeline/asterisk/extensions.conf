;; Dialplan: hand every call to the pipeline, decide nothing here.
;;
;; Asterisk deliberately holds no policy. AudioSocket carries only a UUID — no
;; caller ID, no direction — so the dialplan asks the pipeline for permission
;; first and receives a call id back. A socket whose id was never issued is
;; refused, which means reaching the AudioSocket port is not enough to start a
;; conversation with the agent.

[globals]
PIPELINE_HTTP = http://voice-pipeline:8082
;; Substituted from SERVICE_TOKEN at container start. Both services sit on an
;; internal network, but an unauthenticated endpoint that hands out call ids or
;; audio streams is not something to leave lying around.
PIPELINE_TOKEN = ${SERVICE_TOKEN}

;; --- Incoming calls --------------------------------------------------------
[jarvis-inbound]
exten => _X.,1,NoOp(inbound call from ${CALLERID(num)})
 ;; The pipeline answers with a UUID for an authorised caller, or "denied".
 ;; Authorisation happens before Answer() so an unknown number is never
 ;; connected — and, since the call is not picked up, never billed.
 same => n,Set(DECISION=${CURL(${PIPELINE_HTTP}/v1/inbound?caller=${URIENCODE(${CALLERID(num)})}&token=${PIPELINE_TOKEN})})
 same => n,GotoIf($["${DECISION}" = ""]?unavailable)
 same => n,GotoIf($["${DECISION}" = "denied"]?denied)
 same => n,Answer()
 ;; Give the line a moment to settle before streaming, otherwise the greeting
 ;; starts before the caller's audio path is up and its first word is lost.
 same => n,Wait(0.5)
 ;; Double underscore inherits the id into the WebSocket channel. Its JSON
 ;; MEDIA_START event is what the pipeline uses to pair audio to this caller.
 same => n,Set(__JARVIS_CALL_ID=${DECISION})
 ;; chan_websocket keeps 16 kHz slin media; AudioSocket() unconditionally
 ;; converts every call to slin (8 kHz), which loses consonant detail before STT.
 ;; b() runs on the newly-created WebSocket channel itself. __ inheritance is
 ;; not guaranteed for this channel driver, while MEDIA_START reports its own
 ;; variables verbatim.
 same => n,Dial(WebSocket/jarvis-media/c(slin16)f(json),,b(jarvis-ws-vars^s^1(${JARVIS_CALL_ID})))
 same => n,Hangup()

 same => n(denied),NoOp(caller ${CALLERID(num)} is not on the allowlist)
 ;; Busy rather than a spoken rejection: an unknown caller learns nothing about
 ;; what is behind the number.
 same => n,Busy()
 same => n,Hangup()

 same => n(unavailable),NoOp(pipeline unreachable)
 same => n,Congestion()
 same => n,Hangup()

;; --- Outgoing calls --------------------------------------------------------
;; Reached by a call file the pipeline drops in /var/spool/asterisk/outgoing.
;; JARVIS_CALL_ID is set there, so the pipeline already knows which conversation
;; this socket belongs to before the call is answered.
[jarvis-outbound]
 exten => s,1,NoOp(outbound call ${JARVIS_CALL_ID})
 same => n,Wait(0.5)
 same => n,Set(__JARVIS_CALL_ID=${JARVIS_CALL_ID})
 same => n,Dial(WebSocket/jarvis-media/c(slin16)f(json),,b(jarvis-ws-vars^s^1(${JARVIS_CALL_ID})))
 same => n,Hangup()

;; Set the correlation id directly on the WebSocket channel. chan_websocket
;; serialises this value in its JSON MEDIA_START event for the Node pipeline.
[jarvis-ws-vars]
exten => s,1,Set(JARVIS_CALL_ID=${ARG1})
 same => n,Return()
