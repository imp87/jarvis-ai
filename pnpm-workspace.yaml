packages:
  - "packages/*"
  - "services/*"
  - "apps/*"

# Packages whose postinstall fetches a required native binary. Everything else
# is blocked from running install scripts.
onlyBuiltDependencies:
  - esbuild # tsx
  - ffmpeg-static # bundled ffmpeg for @jarvis/speech
  - onnxruntime-node # local Whisper inference
  - sharp # pulled in by @huggingface/transformers
  - protobufjs
